{{- with .Page.Resources.ByType "image" -}}
  <div class="main-carousel" data-flickity='{ "fullscreen": true, "lazyLoad": 1 }'>
  {{ range . -}}
    <div class="carousel-cell">
      <img class="carousel-cell-image" data-flickity-lazyload="{{ .Permalink }}">
    </div>
  {{- end }}
  </div>
{{-  end -}}

{{- with .Page.Params.featured_image -}}
  {{- with $.Page.Resources.GetMatch . -}}
    <div class="summary-featured-image">
      <img src="{{- .Permalink -}}" alt="{{- $.Page.Title }} feature image"/>
    </div>
  {{- end -}}
{{- end -}}

<div id="skatepark-map" class="skatepark-map" width="{{ (.Get " width") }}" height="{{ (.Get " height") }}"></div>

<script id="skatepark-map-data" type="application/json">
[
  {{- range $index, $element := where .Site.RegularPages "Type" "skateparks" -}}
    {{- if $index }},{{ end -}}

    {{- $imagePermalink := "" -}}
    {{- with $element.Params.featured_image -}}
      {{- with $element.Resources.GetMatch . -}}
        {{- $imagePermalink = .Permalink -}}
      {{- end -}}
    {{- end -}}

    {
      "title": {{ $element.Title }},
      "permalink": {{ $element.Permalink }},
      "photo": {{ $imagePermalink }},
      "categories": {{ $element.Params.categories }},
      "lat": {{ float $element.Params.latitude }},
      "lng": {{ float $element.Params.longitude }}
    }
  {{- end -}}
]
</script>
<script id="skatepark-shop-data" type="application/json">
[
  {{- range $index, $element := hugo.Data.shops -}}
    {{- if $index }},{{ end -}}
    {
      "title": {{ $element.title }},
      "address": {{ $element.address }},
      "website": {{ $element.website }},
      "lat": {{ float $element.latitude }},
      "lng": {{ float $element.longitude }},
      "shop": true
    }
  {{- end -}}
]
</script>
